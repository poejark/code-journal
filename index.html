<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Journal</title>
    <link rel="icon" href="images/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <div class="container">Code Journal</div>
    </header>
    <main class="container">
      <div data-view="entry-form" class="hidden">
        <h2><strong>New Entry</strong></h2>
        <form action="" id="formId">
          <div class="row">
            <div class="column-half">
              <img
                src="images/placeholder-image-square.jpg"
                alt=""
                class="form-image" />
            </div>
            <div class="column-half">
              <label for="title">Title</label> <br />
              <input type="text" name="title" required /> <br />
              <label for="photo">Photo URL</label> <br />
              <input type="text" name="photo" required id="photo-url" />
            </div>
            <div class="column-full">
              <label for="notes">Notes</label> <br />
              <textarea name="notes" id="notesId" required></textarea>
            </div>
            <div class="submit-wrapper">
              <input type="submit" class="submit" value="SAVE" />
            </div>
          </div>
        </form>
      </div>
      <div data-view="entries">
        <div>
          <div class="row align">
            <h1>Entries</h1>
            <button class="new">NEW</button>
          </div>
          <ul></ul>
        </div>
      </div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
